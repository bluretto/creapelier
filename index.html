<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi página</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
      background: #f4f4f4;
    }
    img {
      max-width: 220px;
      margin-bottom: 20px;
    }
    .links a {
      display: block;
      margin: 10px 0;
      padding: 12px 20px;
      border-radius: 12px;
      background: white;
      text-decoration: none;
      color: #333;
      font-size: 18px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: 0.2s;
    }
    .links a:hover {
      background: #0070f3;
      color: white;
    }
  </style>
</head>
<body>
  <img src="logo.png" alt="Mi logo">
  <div class="links">
    <a href="https://instagram.com/creapelier" target="_blank">Instagram</a>
    <a href="https://tiktok.com/@creapelier" target="_blank">TikTok</a>
  </div>
</body>
</html>
